[project]
name = "tutokana"
version = "0.1.0"
description = "Computer-aided pronunciation training on speechocean762: score-register tokens + regression heads on Gemma 4."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "accelerate>=1.14.0",
    "datasets[audio]>=3.6.0,<4.0.0",
    "peft>=0.19.0",
    "safetensors>=0.6.0",
    "scipy>=1.15",
    # numba (via librosa) requires numpy<2.5
    "numpy>=2.2,<2.5",
    "torch>=2.11.0",
    "torchvision>=0.20",
    "transformers>=5.10.0",
    "wandb>=0.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutokana"]

[tool.uv]
# Keep the resolver off ancient numba/llvmlite sdists that fail to build on modern Python
constraint-dependencies = ["numba>=0.60", "llvmlite>=0.44"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
